name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Verify command entry points
        run: |
          review-coach --version
          python -m code_review_coach --version
      - name: Lint
        run: ruff check analyzer app.py cli.py code_review_coach
      - name: Test
        run: python -m pytest --cov=analyzer --cov-report=term-missing

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Audit runtime dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e ".[web]"
          pip-audit
