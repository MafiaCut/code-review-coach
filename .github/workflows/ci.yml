name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Verify command entry points
        run: |
          review-coach --version
          python -m code_review_coach --version
      - name: Lint
        run: ruff check analyzer app.py cli.py code_review_coach
      - name: Test
        run: python -m pytest --cov=analyzer --cov-report=term-missing

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Audit runtime dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e ".[web]"
          pip-audit

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "code_review_coach/cli.py",
              "code_review_coach/web.py",
              "code_review_coach/static/index.html",
              "code_review_coach/demos/demo_clean.py",
              "code_review_coach/demos/demo_dirty.py",
          }
          missing = required - names
          assert not missing, f"wheel is missing packaged resources: {sorted(missing)}"
          entry_points = next(name for name in names if name.endswith("entry_points.txt"))
          with zipfile.ZipFile(wheel) as archive:
              scripts = archive.read(entry_points).decode("utf-8")
          assert "review-coach = code_review_coach.cli:main" in scripts
          assert "review-coach-web = code_review_coach.web:main" in scripts
          PY
